<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Presentation</title>

    <!-- FIXED: Replaced missing local styles with absolute CDN links -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cloudflare.com">
  </head>
  <body>

    <!-- FIXED: Wrapped your slides inside the mandatory reveal framework layout -->
    <div class="reveal">
      <div class="slides">
        
        <!-- Slide 1 -->
        <section>
          <h1>Test</h1>
          <p>Welcome to my test slide deck</p>
        </section>

        <!-- Slide 2 -->
        <section>
          <h2>Second Slide</h2>
          <p>Press the right arrow key to see me.</p>
        </section>

        <!-- Slide 3 -->
        <section>
          <h2>Third Slide</h2>
          <p>The END.</p>
        </section>

      </div>
    </div>

    <!-- FIXED: Replaced missing local javascript with CDN link & initialization -->
    <script src="https://cloudflare.com"></script>
    <script>
      Reveal.initialize({
        hash: true,
        controls: true,
        progress: true,
        center: true
      });
    </script>
  </body>
</html>
